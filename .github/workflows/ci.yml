name: CI

on:
  push:
    branches: [master, main, develop, ci-cd]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {} # E2E(Playwright) 잡 수동 실행용

jobs:
  # ─────────────────────────────────────────
  # Backend: lint + test
  # ─────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check . ../test/backend

      - name: Format check (ruff)
        run: uv run ruff format --check . ../test/backend

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: 'postgresql+asyncpg://user:password@localhost/test'
          ANTHROPIC_API_KEY: 'dummy'
          GEMINI_API_KEY: 'dummy'
          LANGSMITH_API_KEY: 'dummy'
          AWS_ACCESS_KEY_ID: 'dummy'
          AWS_SECRET_ACCESS_KEY: 'dummy'
          SQS_SIMULATION_QUEUE_URL: 'https://sqs.ap-northeast-2.amazonaws.com/dummy/dummy'
        # testpaths(../test/backend)를 pyproject가 가리킴 → 인자 없이 실행
        run: uv run pytest -v --tb=short

  # ─────────────────────────────────────────
  # Frontend: lint + build
  # ─────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

  # ─────────────────────────────────────────
  # E2E: Playwright (수동 실행 전용)
  #
  # 시뮬·토론은 실 LLM 호출(비용)이고, 토큰 주입 로그인·건도연 진입은
  # doyeon(USER/ADMIN)·건도연 프로젝트가 시드된 DB가 있어야 동작한다.
  # 따라서 push/PR에선 돌리지 않고 workflow_dispatch로만 실행한다.
  # 필요한 Secrets:
  #   E2E_DATABASE_URL — doyeon·건도연이 시드된 Postgres(pgvector) 연결 문자열
  #   OPENAI_API_KEY    — 시뮬/토론 LLM 호출
  # ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright) — manual
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      USE_MOCK: 'false'
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # 앱 부팅에 필요한 더미 자격증명(실제 호출 없음)
      ANTHROPIC_API_KEY: 'dummy'
      GEMINI_API_KEY: 'dummy'
      LANGSMITH_API_KEY: 'dummy'
      LANGCHAIN_TRACING_V2: 'false'
      AWS_ACCESS_KEY_ID: 'dummy'
      AWS_SECRET_ACCESS_KEY: 'dummy'
      AWS_REGION: 'ap-northeast-2'
      SQS_SIMULATION_QUEUE_URL: 'https://sqs.ap-northeast-2.amazonaws.com/dummy/dummy'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # P1 — admin/chats 정렬 통합 테스트는 실 DB가 있는 이 잡에서 실제로 돈다.
      - name: Backend integration test (P1)
        working-directory: backend
        # 부분 실행은 config(pyproject)를 자동 탐색 못 함 → -c로 명시(pythonpath 적용)
        run: uv run pytest -c pyproject.toml ../test/backend/admin -v

      - name: Start backend (uvicorn)
        working-directory: backend
        run: |
          uv run uvicorn api.main:app --port 8000 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/docs >/dev/null && exit 0; sleep 2; done
          echo "backend did not become ready" && exit 1

      - name: Build & start frontend
        working-directory: frontend
        run: |
          pnpm build
          pnpm start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && exit 0; sleep 2; done
          echo "frontend did not become ready" && exit 1

      - name: Run E2E (Playwright)
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            test-results
          if-no-files-found: ignore

