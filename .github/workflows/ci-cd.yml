name: CI/CD

# CI(test) 통과 후에만 CD(build→deploy)가 실행되도록 needs 체인으로 묶은 단일 워크플로우.
#   - pull_request          : test(backend·frontend)만. build/deploy 안 함.
#   - push (main·ci-cd)      : test 통과 → build(backend·frontend, ECR push) → deploy(EC2).
#   - workflow_dispatch      : e2e(Playwright) 수동 실행.
# 게이트: build-*/deploy는 needs로 test 성공을 전제하므로, 테스트가 깨지면 배포가 나가지 않는다.
#
# 필요한 GitHub Secrets (진짜 비밀만):
#   - AWS_ACCESS_KEY_ID      : ECR push 권한이 있는 IAM 사용자 액세스 키
#   - AWS_SECRET_ACCESS_KEY  : 위 키의 시크릿
#   - EC2_HOST               : EC2 퍼블릭 IP(EIP) 또는 도메인 (엄밀히 비밀 아니나 IP 노출 최소화로 유지)
#   - EC2_SSH_KEY            : EC2 PEM 키 전체 내용
#   - OPENAI_API_KEY         : 백엔드 테스트·e2e LLM 호출
#   - E2E_DATABASE_URL       : (e2e 잡 전용) 시드된 Postgres 연결 문자열
# 비밀이 아니라 평문으로 둔 값(secret 아님 — 아래 잡에 리터럴):
#   - AWS_REGION=us-west-2 · EC2_USER=ubuntu
#   - NEXT_PUBLIC_API_URL= (빈 값 → /api 상대경로, same-origin)
#   - NEXT_PUBLIC_AUTH_PROVIDER=cognito · NEXT_PUBLIC_COGNITO_REGION=us-west-2
#   - NEXT_PUBLIC_COGNITO_USER_POOL_ID · NEXT_PUBLIC_COGNITO_CLIENT_ID
#     (NEXT_PUBLIC_ 접두사라 프론트 번들에 노출되는 공개값 → 평문. Cognito는 인증 자체를 막지 않음)
#
# 사전 준비:
#   - EC2에 docker · docker compose · awscli 설치 + ECR read 권한(IAM Role 권장)
#   - EC2 ~/clickme/backend/.env 배치(런타임 주입). compose 파일은 deploy 잡이 자동 복사.
# 참고: 장기 키 대신 GitHub OIDC + IAM assume-role 방식이 더 안전(추후 전환 가능).

on:
  push:
    branches: [main, ci-cd]
  pull_request:
    branches: [main, ci-cd]
  workflow_dispatch: {} # E2E(Playwright) 잡 수동 실행용

env:
  ECR_BACKEND: clickme-backend
  ECR_FRONTEND: clickme-frontend

jobs:
  # ═════════════════════════════════════════════════════════════
  # CI — 테스트 (push·PR·dispatch에서 항상 실행, CD의 게이트)
  # ═════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────
  # Backend: lint + test
  # ─────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check . ../test/backend

      - name: Format check (ruff)
        run: uv run ruff format --check . ../test/backend

      # 폰트(Pretendard)는 gitignore라 리포에 없음 → 텍스트 렌더 테스트용으로 받아둠
      - name: Download fonts (Pretendard)
        run: |
          mkdir -p assets/fonts
          base="https://github.com/orioncactus/pretendard/raw/main/packages/pretendard/dist/public/static"
          for w in Regular Bold; do
            curl -fL --retry 3 -o "assets/fonts/Pretendard-$w.otf" "$base/Pretendard-$w.otf"
          done

      # PDF 리포트는 Playwright(Chromium)로 HTML→PDF 렌더 → 브라우저 바이너리 필요
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: 'postgresql+asyncpg://user:password@localhost/test'
          ANTHROPIC_API_KEY: 'dummy'
          GEMINI_API_KEY: 'dummy'
          LANGSMITH_API_KEY: 'dummy'
          AWS_ACCESS_KEY_ID: 'dummy'
          AWS_SECRET_ACCESS_KEY: 'dummy'
        # testpaths(../test/backend)를 pyproject가 가리킴 → 인자 없이 실행
        run: uv run pytest -v --tb=short

      # API 엔드포인트·프론트 라우트 문서(docs·CLAUDE.md)가 코드와 동기화됐는지 검사.
      # 새 라우터/페이지를 추가하고 문서를 갱신 안 하면 여기서 실패 → 로컬에서 gen_docs.py 실행 후 커밋.
      - name: Docs drift check (API·routes)
        run: uv run python scripts/gen_docs.py --check

  # ─────────────────────────────────────────
  # Frontend: lint + build
  # ─────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 폰트(Pretendard)는 gitignore라 리포에 없음 → next/font/local 빌드용으로 받아둠
      - name: Download fonts (Pretendard)
        run: |
          mkdir -p src/app/fonts
          base="https://github.com/orioncactus/pretendard/raw/main/packages/pretendard/dist/public/static"
          for w in Thin Regular Medium Bold Black; do
            curl -fL --retry 3 -o "src/app/fonts/Pretendard-$w.otf" "$base/Pretendard-$w.otf"
          done

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

  # ─────────────────────────────────────────
  # E2E: Playwright (수동 실행 전용 — workflow_dispatch)
  #
  # 시뮬·토론은 실 LLM 호출(비용)이고, 토큰 주입 로그인·건도연 진입은
  # doyeon(USER/ADMIN)·건도연 프로젝트가 시드된 DB가 있어야 동작한다.
  # 따라서 push/PR에선 돌리지 않고 workflow_dispatch로만 실행한다.
  # 필요한 Secrets:
  #   E2E_DATABASE_URL — doyeon·건도연이 시드된 Postgres(pgvector) 연결 문자열
  #   OPENAI_API_KEY    — 시뮬/토론 LLM 호출
  # ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright) — manual
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      USE_MOCK: 'false'
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # 앱 부팅에 필요한 더미 자격증명(실제 호출 없음)
      ANTHROPIC_API_KEY: 'dummy'
      GEMINI_API_KEY: 'dummy'
      LANGSMITH_API_KEY: 'dummy'
      LANGCHAIN_TRACING_V2: 'false'
      AWS_ACCESS_KEY_ID: 'dummy'
      AWS_SECRET_ACCESS_KEY: 'dummy'
      AWS_REGION: 'ap-northeast-2'

    steps:
      - uses: actions/checkout@v4

      # 폰트(Pretendard)는 gitignore라 리포에 없음 → 빌드·렌더용으로 받아둠
      - name: Download fonts
        run: |
          mkdir -p frontend/src/app/fonts backend/assets/fonts
          pre="https://github.com/orioncactus/pretendard/raw/main/packages/pretendard/dist/public/static"
          for w in Thin Regular Medium Bold Black; do
            curl -fL --retry 3 -o "frontend/src/app/fonts/Pretendard-$w.otf" "$pre/Pretendard-$w.otf"
          done
          for w in Regular Bold; do
            curl -fL --retry 3 -o "backend/assets/fonts/Pretendard-$w.otf" "$pre/Pretendard-$w.otf"
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # P1 — admin/chats 정렬 통합 테스트는 실 DB가 있는 이 잡에서 실제로 돈다.
      - name: Backend integration test (P1)
        working-directory: backend
        # 부분 실행은 config(pyproject)를 자동 탐색 못 함 → -c로 명시(pythonpath 적용)
        run: uv run pytest -c pyproject.toml ../test/backend/admin -v

      - name: Start backend (uvicorn)
        working-directory: backend
        run: |
          uv run uvicorn api.main:app --port 8000 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/docs >/dev/null && exit 0; sleep 2; done
          echo "backend did not become ready" && exit 1

      - name: Build & start frontend
        working-directory: frontend
        run: |
          pnpm build
          pnpm start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && exit 0; sleep 2; done
          echo "frontend did not become ready" && exit 1

      - name: Run E2E (Playwright)
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            test-results
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════
  # CD — 빌드 & 배포 (push일 때만 · test 통과 후)
  #   build-*는 needs로 backend·frontend 테스트 성공을 전제한다.
  #   if: push → PR·workflow_dispatch에선 빌드/배포하지 않는다.
  #   트리거 브랜치가 [main, ci-cd]라 그 두 브랜치 push만 배포된다.
  # ═════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────
  # Backend 이미지 빌드 & ECR push
  # ─────────────────────────────────────────
  build-backend:
    name: Build & push backend (ECR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Pretendard(gitignore)는 PDF 텍스트 렌더용 → 빌드 컨텍스트에 받아둠
      - name: Download fonts (Pretendard)
        run: |
          mkdir -p backend/assets/fonts
          base="https://github.com/orioncactus/pretendard/raw/main/packages/pretendard/dist/public/static"
          for w in Regular Bold; do
            curl -fL --retry 3 -o "backend/assets/fonts/Pretendard-$w.otf" "$base/Pretendard-$w.otf"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        run: |
          aws ecr describe-repositories --repository-names "$ECR_BACKEND" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_BACKEND" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ─────────────────────────────────────────
  # Frontend 이미지 빌드 & ECR push
  # ─────────────────────────────────────────
  build-frontend:
    name: Build & push frontend (ECR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Pretendard(gitignore)는 next/font/local 빌드용 → 빌드 컨텍스트에 받아둠
      - name: Download fonts (Pretendard)
        run: |
          mkdir -p frontend/src/app/fonts
          base="https://github.com/orioncactus/pretendard/raw/main/packages/pretendard/dist/public/static"
          for w in Thin Regular Medium Bold Black; do
            curl -fL --retry 3 -o "frontend/src/app/fonts/Pretendard-$w.otf" "$base/Pretendard-$w.otf"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        run: |
          aws ecr describe-repositories --repository-names "$ECR_FRONTEND" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_FRONTEND" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_API_URL은 의도적으로 빈 값 → 프론트가 /api 상대경로로 호출.
      # nginx 단일 진입점이라 어떤 호스트(IP·퍼블릭 DNS·도메인)로 접속해도 same-origin → CORS 미발생.
      # (build-args 블록 안에는 # 주석을 못 넣음 — 리터럴로 전달되므로 여기 step에 둠)
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_AUTH_PROVIDER=cognito
            NEXT_PUBLIC_COGNITO_REGION=us-west-2
            NEXT_PUBLIC_COGNITO_USER_POOL_ID=us-west-2_iHteTHXO0
            NEXT_PUBLIC_COGNITO_CLIENT_ID=75kk3fjlte1qk6ak1of1tb9m3e
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─────────────────────────────────────────
  # EC2 배포 (두 빌드가 끝나야 실행)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4 # compose·nginx 설정 복사용

      # ECR registry 호스트네임을 이 잡 안에서 얻는다(잡 간 output은 secret 마스킹돼 비어짐)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # EC2는 리포를 체크아웃하지 않으므로 compose·nginx 설정을 매 배포마다 최신으로 복사
      # (비밀 없는 파일만. backend/.env 는 EC2에 1회 배치 — 리포에 없음)
      - name: Copy compose & nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml,deploy/nginx.conf,deploy/init-letsencrypt.sh'
          target: /home/ubuntu/clickme

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: us-west-2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,AWS_REGION
          script: |
            set -e
            # EC2 IAM Role(또는 설정된 자격증명)로 ECR 로그인
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"
            cd ~/clickme
            docker pull "$REGISTRY/clickme-backend:latest"
            docker pull "$REGISTRY/clickme-frontend:latest"
            # 최초 1회: TLS 인증서가 없으면 발급(dummy 부트스트랩 → certbot webroot → nginx reload).
            # 인증서가 없으면 nginx가 443 블록의 없는 파일을 참조해 크래시하므로, up 전에 발급한다.
            # init 스크립트가 내부에서 compose up까지 수행하며, 멱등이라 이미 있으면 즉시 종료.
            if [ ! -f /etc/letsencrypt/live/clickme.co.kr/fullchain.pem ]; then
              echo "[CD] TLS 인증서 없음 → 최초 발급 실행"
              bash deploy/init-letsencrypt.sh
            fi
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
