name: CD

# AWS ECR + EC2 배포 파이프라인.
# 역할별 잡 분리: backend 빌드 / frontend 빌드(병렬) → 둘 다 끝나면 deploy.
# GitHub Actions에서 이미지 빌드→ECR push → EC2가 ECR pull → docker compose 재기동.
#
# 필요한 GitHub Secrets:
#   - AWS_ACCESS_KEY_ID      : ECR push 권한이 있는 IAM 사용자 액세스 키
#   - AWS_SECRET_ACCESS_KEY  : 위 키의 시크릿
#   - AWS_REGION             : ECR/EC2 리전 (예: us-west-2)
#   - EC2_HOST               : EC2 퍼블릭 IP 또는 도메인
#   - EC2_USER               : EC2 접속 유저 (ubuntu / ec2-user)
#   - EC2_SSH_KEY            : EC2 PEM 키 전체 내용
#   (NEXT_PUBLIC_API_URL은 더 이상 secret으로 쓰지 않음 — 빈 값으로 빌드해 /api 상대경로 호출 → same-origin)
#   - NEXT_PUBLIC_COGNITO_USER_POOL_ID : Cognito User Pool ID (프론트 빌드 인자, 공개돼도 무방)
#   - NEXT_PUBLIC_COGNITO_CLIENT_ID    : Cognito App Client ID (프론트 빌드 인자, 공개돼도 무방)
# (NEXT_PUBLIC_AUTH_PROVIDER=cognito, NEXT_PUBLIC_COGNITO_REGION=us-west-2 는 비밀 아님 → 평문)
#
# 사전 준비:
#   - EC2에 docker · docker compose · awscli 설치 + ECR read 권한(IAM Role 권장)
#   - EC2 ~/clickme/backend/.env 배치(런타임 주입). compose 파일은 deploy 잡이 자동 복사.
#
# 참고: 장기 키 대신 GitHub OIDC + IAM assume-role 방식이 더 안전(추후 전환 가능).

on:
  workflow_dispatch:
  push:
    branches: [main, ci-cd]

env:
  ECR_BACKEND: clickme-backend
  ECR_FRONTEND: clickme-frontend

jobs:
  # ─────────────────────────────────────────
  # Backend 이미지 빌드 & ECR push
  # ─────────────────────────────────────────
  build-backend:
    name: Build & push backend (ECR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pretendard(gitignore)는 PDF 텍스트 렌더용 → 빌드 컨텍스트에 받아둠
      - name: Download fonts (Pretendard)
        run: |
          mkdir -p backend/assets/fonts
          base="https://github.com/orioncactus/pretendard/raw/main/packages/pretendard/dist/public/static"
          for w in Regular Bold; do
            curl -fL --retry 3 -o "backend/assets/fonts/Pretendard-$w.otf" "$base/Pretendard-$w.otf"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        run: |
          aws ecr describe-repositories --repository-names "$ECR_BACKEND" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_BACKEND" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ─────────────────────────────────────────
  # Frontend 이미지 빌드 & ECR push
  # ─────────────────────────────────────────
  build-frontend:
    name: Build & push frontend (ECR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NotoSansKR(gitignore)는 next/font/local 빌드용 → 빌드 컨텍스트에 받아둠
      - name: Download fonts (NotoSansKR)
        run: |
          mkdir -p frontend/src/app/fonts
          base="https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/KR"
          for w in Thin Regular Medium Bold Black; do
            curl -fL --retry 3 -o "frontend/src/app/fonts/NotoSansKR-$w.otf" "$base/NotoSansKR-$w.otf"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        run: |
          aws ecr describe-repositories --repository-names "$ECR_FRONTEND" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_FRONTEND" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_API_URL은 의도적으로 빈 값 → 프론트가 /api 상대경로로 호출.
      # nginx 단일 진입점이라 어떤 호스트(IP·퍼블릭 DNS·도메인)로 접속해도 same-origin → CORS 미발생.
      # (build-args 블록 안에는 # 주석을 못 넣음 — 리터럴로 전달되므로 여기 step에 둠)
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_AUTH_PROVIDER=cognito
            NEXT_PUBLIC_COGNITO_REGION=us-west-2
            NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─────────────────────────────────────────
  # EC2 배포 (두 빌드가 끝나야 실행)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4 # compose·nginx 설정 복사용

      # ECR registry 호스트네임을 이 잡 안에서 얻는다(잡 간 output은 secret 마스킹돼 비어짐)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # EC2는 리포를 체크아웃하지 않으므로 compose·nginx 설정을 매 배포마다 최신으로 복사
      # (비밀 없는 파일만. backend/.env 는 EC2에 1회 배치 — 리포에 없음)
      - name: Copy compose & nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml,deploy/nginx.conf,deploy/init-letsencrypt.sh'
          target: /home/${{ secrets.EC2_USER }}/clickme

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,AWS_REGION
          script: |
            set -e
            # EC2 IAM Role(또는 설정된 자격증명)로 ECR 로그인
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"
            cd ~/clickme
            docker pull "$REGISTRY/clickme-backend:latest"
            docker pull "$REGISTRY/clickme-frontend:latest"
            # 최초 1회: TLS 인증서가 없으면 발급(dummy 부트스트랩 → certbot webroot → nginx reload).
            # 인증서가 없으면 nginx가 443 블록의 없는 파일을 참조해 크래시하므로, up 전에 발급한다.
            # init 스크립트가 내부에서 compose up까지 수행하며, 멱등이라 이미 있으면 즉시 종료.
            if [ ! -f /etc/letsencrypt/live/clickme.co.kr/fullchain.pem ]; then
              echo "[CD] TLS 인증서 없음 → 최초 발급 실행"
              bash deploy/init-letsencrypt.sh
            fi
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
