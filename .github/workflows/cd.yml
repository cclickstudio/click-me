name: CD

# AWS ECR + EC2 배포 파이프라인.
# GitHub Actions에서 이미지를 빌드해 ECR로 push → EC2가 ECR에서 pull → docker compose 재기동.
#
# 필요한 GitHub Secrets:
#   - AWS_ACCESS_KEY_ID      : ECR push 권한이 있는 IAM 사용자 액세스 키
#   - AWS_SECRET_ACCESS_KEY  : 위 키의 시크릿
#   - AWS_REGION             : ECR/EC2 리전 (예: ap-northeast-2)
#   - EC2_HOST               : EC2 퍼블릭 IP 또는 도메인
#   - EC2_USER               : EC2 접속 유저 (ubuntu / ec2-user)
#   - EC2_SSH_KEY            : EC2 PEM 키 전체 내용
#   - NEXT_PUBLIC_API_URL    : 운영 API 주소 (프론트 빌드 인자)
#   - DISCORD_WEBHOOK_URL    : (선택) 디스코드 알림
#
# 사전 준비:
#   - ECR 리포지토리 clickme-backend / clickme-frontend (없으면 아래 ensure 스텝이 자동 생성)
#   - EC2에 docker · docker compose · awscli 설치, 그리고 ECR read 권한
#     → 권장: EC2 인스턴스에 IAM Role(AmazonEC2ContainerRegistryReadOnly) 부착
#       (Role을 붙이면 EC2 쪽엔 AWS 키를 따로 저장할 필요 없음)
#   - EC2 ~/clickme 에 docker-compose.prod.yml 배치 (이미지 태그를 ECR URI로 참조)
#
# 참고: AWS_ACCESS_KEY_ID/SECRET 대신 GitHub OIDC + IAM Role(assume-role)로
#       장기 키 없이 인증하는 방식이 더 안전하다. 도입 시 configure-aws-credentials의
#       role-to-assume 입력으로 교체.

on:
  workflow_dispatch: # 준비되면 아래 push 트리거 주석 해제
  # push:
  #   branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_BACKEND: clickme-backend
  ECR_FRONTEND: clickme-frontend

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to EC2 (ECR)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # 폰트(NotoSansKR·Pretendard)는 gitignore라 체크아웃에 없음.
      # Docker 빌드 컨텍스트(COPY . .)에 포함되도록 빌드 전에 받아둔다.
      - name: Download fonts
        run: |
          mkdir -p frontend/src/app/fonts backend/assets/fonts
          noto="https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/KR"
          for w in Thin Regular Medium Bold Black; do
            curl -fL --retry 3 -o "frontend/src/app/fonts/NotoSansKR-$w.otf" "$noto/NotoSansKR-$w.otf"
          done
          pre="https://github.com/orioncactus/pretendard/raw/main/packages/pretendard/dist/public/static"
          for w in Regular Bold; do
            curl -fL --retry 3 -o "backend/assets/fonts/Pretendard-$w.otf" "$pre/Pretendard-$w.otf"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories
        run: |
          for repo in "$ECR_BACKEND" "$ECR_FRONTEND"; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" >/dev/null
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # EC2는 리포를 체크아웃하지 않으므로 compose 파일을 매 배포마다 최신으로 복사
      # (비밀 없는 파일만. backend/.env 는 EC2에 1회 수동 배치 — 리포에 없음)
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/${{ secrets.EC2_USER }}/clickme

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,AWS_REGION
          script: |
            set -e
            # EC2 IAM Role(또는 설정된 자격증명)로 ECR 로그인
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"
            cd ~/clickme
            docker pull "$REGISTRY/clickme-backend:latest"
            docker pull "$REGISTRY/clickme-frontend:latest"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Notify deploy result
        if: always()
        uses: sarisia/actions-status-discord@v1
        continue-on-error: true
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: 'ClickMe 배포 (ECR)'
          description: 'Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`'
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
