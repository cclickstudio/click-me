[project]
name = "clickme-backend"
version = "2.0.0"
description = "ClickMe AI Ad Simulation Platform - Backend"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=4.2.5",
    "langsmith>=0.1.0",
    # LLM SDKs
    "openai>=1.50.0",
    "anthropic>=0.36.0",
    "google-genai>=1.0.0",  # 시뮬레이터(신 SDK)
    "google-generativeai>=0.8.0",  # 채팅(api/routers/chat.py) — 추후 google-genai로 이전 예정
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    # LangGraph 체크포인터(Postgres) — HITL thread 영속(checkpoints* 테이블)
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
    # AWS
    "boto3>=1.35.0",
    "aioboto3>=13.0.0",
    # Config & Validation
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    # PDF Report
    "reportlab>=4.2.0",
    "weasyprint>=62.0",
    # Numeric
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # Image (Generator — IG 게시용 JPEG 변환)
    "pillow>=10.0.0",
    # Utils
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=4.0.0",
    "playwright>=1.60.0",
    "pypdf>=6.13.3",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
    "trafilatura>=2.1.0",
    "apscheduler>=3.11.2",
    "deepagents>=0.6.12",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "SIM", # flake8-simplify
]
ignore = [
    "ANN401", # dynamically typed expressions (Any)
    "ANN201", # missing return type annotation for public function (routers 등)
    "ANN001", # missing type annotation for function argument
    "B008",   # do not perform function call in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() 후 import는 의도적 순서
"api/main.py" = ["E402"]
# 테스트 ruff 규칙(ANN/E402 완화)은 backend 밖으로 이동 → test/backend/ruff.toml에서 관리
# alembic 마이그레이션은 SQL 문자열 포함으로 E501 허용
"alembic/**" = ["E501"]
# 한국어 시스템 프롬프트 / 긴 emit 문자열 허용
"api/routers/chat.py" = ["E501"]
"domain/chat/adapters/clio.py" = ["E501"]
"domain/simulation/service/simulation_service.py" = ["E501"]
"domain/generator/pipeline/strategy_planner.py" = ["E501"]
# 도구 파일 내 긴 문자열 허용
"tools/simulation/ssr_scorer.py" = ["E501"]
"api/routers/ads.py" = ["E501"]
# PDF 리포트는 긴 Tailwind HTML 문자열 포함 허용
"domain/simulation/tools/debate/pdf_report.py" = ["E501"]
# 모델 주석
"core/models.py" = ["E501"]
# 한국어 시스템 프롬프트 긴 줄 허용 (generator 파이프라인)
"domain/generator/**" = ["E501"]
# 검수 시트 생성기는 임베드 HTML/CSS/JS 문자열 포함으로 E501 허용
"scripts/measure/build_review_sheet.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "agents", "tools", "core", "domain"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 테스트는 backend 밖(루트 test/backend)으로 이동됨. import 루트 2개를 sys.path에 둔다 —
# "."(backend: api/core/domain/tools)와 "../test/backend"(테스트끼리 공유하는 management.helpers 등).
# testpaths로 이동 위치를 가리킨다. 실행은 그대로 `cd backend && uv run pytest`.
testpaths = ["../test/backend"]
pythonpath = [".", "../test/backend"]
