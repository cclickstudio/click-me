# 단일 진입점 리버스 프록시 — 80은 ACME 챌린지+HTTPS 리다이렉트, 443은 실제 서비스
# /api는 backend, 그 외는 frontend. TLS는 Let's Encrypt(/etc/letsencrypt, 호스트 마운트).

# HTTP — Let's Encrypt 갱신 챌린지만 처리하고 나머지는 HTTPS로 영구 리다이렉트
server {
    listen 80;
    server_name clickme.co.kr www.clickme.co.kr;

    # certbot webroot 갱신 챌린지 (무중단 갱신)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — 실제 서비스 진입점
server {
    listen 443 ssl;
    server_name clickme.co.kr www.clickme.co.kr;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/clickme.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clickme.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Swagger/OpenAPI 외부 차단 (백엔드 docs는 prod에서 이미 꺼지지만 한 겹 더)
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # 백엔드 API (SSE 스트리밍·장시간 시뮬 대비 버퍼링 off + 긴 타임아웃)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 헬스체크(선택)
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # 프론트엔드 (그 외 전부)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
