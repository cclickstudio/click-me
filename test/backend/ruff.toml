# backend 테스트 전용 ruff 설정 — backend/pyproject.toml 규칙을 상속하고 테스트 완화를 얹는다.
# 테스트가 backend 밖(루트 test/backend)으로 이동하면서, backend의 per-file-ignores("tests/**")가
# 더는 매칭되지 않아 여기서 별도 관리한다. ruff는 검사 대상의 가장 가까운 설정을 자동 사용한다.
extend = "../../backend/pyproject.toml"

[lint]
# 테스트 헬퍼는 test/backend 루트에 패키지로 있다(management.helpers 등) → first-party로 인식.
[lint.isort]
known-first-party = ["api", "agents", "tools", "core", "domain"]

[lint.per-file-ignores]
# 테스트 파일은 타입 어노테이션 불필요
"**/*.py" = ["ANN"]
# conftest는 환경변수 설정 후 import(load_dotenv 순서) → E402 허용
"conftest.py" = ["E402", "ANN"]
