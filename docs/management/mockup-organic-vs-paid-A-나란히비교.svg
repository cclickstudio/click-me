<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif">
  <!-- 시안 A: 오가닉 vs 광고 게시물 '나란히 비교' 뷰 (광고 매니지먼트) -->
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="840" fill="#f1f5f9"/>

  <!-- 상단 바 -->
  <rect width="1280" height="64" fill="url(#hdr)"/>
  <text x="32" y="40" fill="#ffffff" font-size="20" font-weight="700">광고 매니지먼트 · 게시물 성과 비교</text>
  <text x="372" y="40" fill="#c7d2fe" font-size="14">오가닉 vs 광고 집행 · 증분 리프트 검증</text>
  <!-- A/B 토글 -->
  <rect x="980" y="18" width="120" height="28" rx="14" fill="#ffffff" opacity="0.18"/>
  <rect x="980" y="18" width="60" height="28" rx="14" fill="#ffffff"/>
  <text x="1010" y="37" fill="#4f46e5" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <text x="1070" y="37" fill="#e0e7ff" font-size="13" text-anchor="middle">B</text>
  <circle cx="1135" cy="32" r="16" fill="#ffffff" opacity="0.25"/>
  <text x="1135" y="37" fill="#fff" font-size="13" text-anchor="middle">강</text>

  <!-- 필터 줄 -->
  <rect x="32" y="84" width="1216" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="113" fill="#334155" font-size="13" font-weight="600">프로젝트</text>
  <rect x="118" y="96" width="170" height="24" rx="6" fill="#eef2ff"/>
  <text x="130" y="113" fill="#4338ca" font-size="12">여름 신상 캠페인 ▾</text>
  <text x="312" y="113" fill="#334155" font-size="13" font-weight="600">기간</text>
  <rect x="356" y="96" width="160" height="24" rx="6" fill="#f1f5f9"/>
  <text x="368" y="113" fill="#475569" font-size="12">최근 14일 ▾</text>
  <text x="540" y="113" fill="#334155" font-size="13" font-weight="600">플랫폼</text>
  <rect x="596" y="96" width="92" height="24" rx="6" fill="#f1f5f9"/>
  <text x="608" y="113" fill="#475569" font-size="12">Instagram ▾</text>
  <rect x="1090" y="94" width="140" height="28" rx="8" fill="#4f46e5"/>
  <text x="1160" y="113" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">게시물 선택 ▾</text>

  <!-- 비교 대상 게시물 헤더 -->
  <rect x="32" y="148" width="1216" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="48" y="164" width="52" height="52" rx="8" fill="#cbd5e1"/>
  <text x="74" y="196" fill="#475569" font-size="11" text-anchor="middle">IMG</text>
  <text x="116" y="180" fill="#0f172a" font-size="15" font-weight="700">“여름엔 역시 — 신상 원피스 출시 🌴”</text>
  <text x="116" y="202" fill="#64748b" font-size="12">게시 2026-06-02 · 동일 크리에이티브가 오가닉/광고 양쪽에 사용됨 (1:1 비교 가능)</text>
  <rect x="116" y="210" width="86" height="18" rx="9" fill="#ecfeff"/>
  <text x="159" y="223" fill="#0e7490" font-size="11" text-anchor="middle">매칭 신뢰도 高</text>

  <!-- 좌: 오가닉 카드 -->
  <rect x="32" y="248" width="392" height="412" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="248" width="392" height="44" rx="12" fill="#f8fafc"/>
  <rect x="32" y="280" width="392" height="12" fill="#f8fafc"/>
  <circle cx="58" cy="270" r="7" fill="#0ea5e9"/>
  <text x="74" y="275" fill="#0f172a" font-size="15" font-weight="700">일반 게시물 (오가닉)</text>
  <text x="392" y="275" fill="#94a3b8" font-size="11" text-anchor="end">비용 ₩0</text>

  <g font-size="13">
    <text x="56" y="324" fill="#64748b">도달 (Reach)</text>
    <text x="400" y="324" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">3,120</text>
    <text x="56" y="362" fill="#64748b">노출 (Impressions)</text>
    <text x="400" y="362" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">4,540</text>
    <text x="56" y="400" fill="#64748b">참여 (좋아요+댓글+저장)</text>
    <text x="400" y="400" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">286</text>
    <text x="56" y="438" fill="#64748b">참여율</text>
    <text x="400" y="438" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">6.3%</text>
    <text x="56" y="476" fill="#64748b">프로필 방문</text>
    <text x="400" y="476" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">141</text>
  </g>
  <line x1="56" y1="338" x2="400" y2="338" stroke="#f1f5f9"/>
  <line x1="56" y1="376" x2="400" y2="376" stroke="#f1f5f9"/>
  <line x1="56" y1="414" x2="400" y2="414" stroke="#f1f5f9"/>
  <line x1="56" y1="452" x2="400" y2="452" stroke="#f1f5f9"/>
  <!-- 오가닉 막대 -->
  <text x="56" y="512" fill="#475569" font-size="12" font-weight="600">도달 규모</text>
  <rect x="56" y="522" width="180" height="20" rx="4" fill="#e0f2fe"/>
  <rect x="56" y="522" width="120" height="20" rx="4" fill="#38bdf8"/>
  <text x="56" y="566" fill="#94a3b8" font-size="11">출처 · instagram_manage_insights (media insights)</text>

  <!-- 우: 광고 카드 -->
  <rect x="448" y="248" width="392" height="412" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
  <rect x="448" y="248" width="392" height="44" rx="12" fill="#eef2ff"/>
  <rect x="448" y="280" width="392" height="12" fill="#eef2ff"/>
  <circle cx="474" cy="270" r="7" fill="#6366f1"/>
  <text x="490" y="275" fill="#0f172a" font-size="15" font-weight="700">광고 집행 게시물 (Paid)</text>
  <text x="824" y="275" fill="#4f46e5" font-size="11" text-anchor="end" font-weight="600">지출 ₩84,000</text>

  <g font-size="13">
    <text x="472" y="324" fill="#64748b">도달 (Reach)</text>
    <text x="816" y="324" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">22,870</text>
    <text x="472" y="362" fill="#64748b">노출 (Impressions)</text>
    <text x="816" y="362" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">41,200</text>
    <text x="472" y="400" fill="#64748b">링크 클릭</text>
    <text x="816" y="400" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">1,930</text>
    <text x="472" y="438" fill="#64748b">CTR</text>
    <text x="816" y="438" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">4.7%</text>
    <text x="472" y="476" fill="#64748b">CPC</text>
    <text x="816" y="476" fill="#0f172a" font-size="18" font-weight="700" text-anchor="end">₩43</text>
  </g>
  <line x1="472" y1="338" x2="816" y2="338" stroke="#eef2ff"/>
  <line x1="472" y1="376" x2="816" y2="376" stroke="#eef2ff"/>
  <line x1="472" y1="414" x2="816" y2="414" stroke="#eef2ff"/>
  <line x1="472" y1="452" x2="816" y2="452" stroke="#eef2ff"/>
  <text x="472" y="512" fill="#475569" font-size="12" font-weight="600">도달 규모</text>
  <rect x="472" y="522" width="344" height="20" rx="4" fill="#e0e7ff"/>
  <rect x="472" y="522" width="344" height="20" rx="4" fill="#6366f1"/>
  <text x="472" y="566" fill="#94a3b8" font-size="11">출처 · ads_read (campaign/ad insights)</text>

  <!-- 우측: 증분 리프트 검증 패널 -->
  <rect x="864" y="248" width="384" height="412" rx="12" fill="#0f172a"/>
  <text x="888" y="284" fill="#e2e8f0" font-size="15" font-weight="700">증분 리프트 검증</text>
  <text x="888" y="306" fill="#94a3b8" font-size="11">광고가 오가닉 대비 추가로 만든 성과</text>

  <text x="888" y="350" fill="#94a3b8" font-size="12">증분 도달 (Δ Reach)</text>
  <text x="1224" y="356" fill="#4ade80" font-size="24" font-weight="800" text-anchor="end">+19,750</text>
  <text x="888" y="378" fill="#64748b" font-size="11">×7.3 (오가닉 3,120 → 22,870)</text>

  <line x1="888" y1="398" x2="1224" y2="398" stroke="#1e293b"/>
  <text x="888" y="430" fill="#94a3b8" font-size="12">증분 노출 (Δ Impr.)</text>
  <text x="1224" y="436" fill="#4ade80" font-size="24" font-weight="800" text-anchor="end">+36,660</text>

  <line x1="888" y1="456" x2="1224" y2="456" stroke="#1e293b"/>
  <text x="888" y="488" fill="#94a3b8" font-size="12">참여 효율 비교</text>
  <text x="1224" y="494" fill="#fbbf24" font-size="20" font-weight="800" text-anchor="end">오가닉 6.3% vs 광고 4.7%</text>
  <text x="888" y="512" fill="#64748b" font-size="11">광고는 도달↑·참여율↓ — 인지 확산형</text>

  <!-- 검증 상태 배지 -->
  <rect x="888" y="540" width="336" height="56" rx="10" fill="#052e16" stroke="#166534"/>
  <circle cx="916" cy="568" r="10" fill="#22c55e"/>
  <text x="912" y="572" fill="#052e16" font-size="12" font-weight="800">✓</text>
  <text x="938" y="564" fill="#bbf7d0" font-size="13" font-weight="700">검증 통과 · 유의미한 증분</text>
  <text x="938" y="582" fill="#86efac" font-size="11">95% CI 도달 리프트 +14,200 ~ +25,300</text>

  <text x="888" y="628" fill="#64748b" font-size="11">* 동일 크리에이티브·중복 도달 보정 후 추정치 (exploratory)</text>

  <!-- 하단 주의/면책 -->
  <rect x="32" y="676" width="1216" height="60" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="52" y="704" fill="#92400e" font-size="13" font-weight="700">검증 노트</text>
  <text x="52" y="724" fill="#b45309" font-size="12">오가닉/광고 도달은 중복될 수 있어 단순 합산 금지 · 증분치는 추정(분포로 표기) · "예측 CTR" 등 실측 스케일 환산 금지 (CLAUDE.md KPI 원칙).</text>

  <text x="32" y="772" fill="#94a3b8" font-size="11">시안 A — 나란히 비교(Side-by-side) · 1개 게시물 심층 비교에 적합</text>
  <text x="32" y="792" fill="#cbd5e1" font-size="11">docs/management/mockup-organic-vs-paid-A-나란히비교.svg · 목업(미구현 화면 예시)</text>
</svg>
