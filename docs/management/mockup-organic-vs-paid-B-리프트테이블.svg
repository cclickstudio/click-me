<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif">
  <!-- 시안 B: 오가닉 vs 광고 '리프트 검증 테이블' 뷰 (여러 게시물 일괄) -->
  <defs>
    <linearGradient id="hdrB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="840" fill="#f1f5f9"/>

  <!-- 상단 바 -->
  <rect width="1280" height="64" fill="url(#hdrB)"/>
  <text x="32" y="40" fill="#ffffff" font-size="20" font-weight="700">광고 매니지먼트 · 리프트 검증 보드</text>
  <text x="392" y="40" fill="#99f6e4" font-size="14">게시물별 오가닉→광고 증분 효과 일괄 점검</text>
  <rect x="980" y="18" width="120" height="28" rx="14" fill="#ffffff" opacity="0.18"/>
  <rect x="1040" y="18" width="60" height="28" rx="14" fill="#ffffff"/>
  <text x="1010" y="37" fill="#ccfbf1" font-size="13" text-anchor="middle">A</text>
  <text x="1070" y="37" fill="#0f766e" font-size="13" font-weight="700" text-anchor="middle">B</text>
  <circle cx="1135" cy="32" r="16" fill="#ffffff" opacity="0.25"/>
  <text x="1135" y="37" fill="#fff" font-size="13" text-anchor="middle">강</text>

  <!-- KPI 요약 타일 -->
  <g>
    <rect x="32" y="84" width="294" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="52" y="112" fill="#64748b" font-size="12">검증한 게시물</text>
    <text x="52" y="150" fill="#0f172a" font-size="30" font-weight="800">12</text>
    <text x="120" y="150" fill="#94a3b8" font-size="12">개 (최근 14일)</text>

    <rect x="338" y="84" width="294" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="358" y="112" fill="#64748b" font-size="12">평균 증분 도달</text>
    <text x="358" y="150" fill="#0d9488" font-size="30" font-weight="800">×6.8</text>
    <text x="436" y="150" fill="#94a3b8" font-size="12">오가닉 대비</text>

    <rect x="644" y="84" width="294" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="664" y="112" fill="#64748b" font-size="12">평균 광고 CTR</text>
    <text x="664" y="150" fill="#0f172a" font-size="30" font-weight="800">4.2%</text>
    <text x="742" y="150" fill="#94a3b8" font-size="12">링크 클릭 기준</text>

    <rect x="950" y="84" width="298" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="970" y="112" fill="#64748b" font-size="12">검증 통과율</text>
    <text x="970" y="150" fill="#16a34a" font-size="30" font-weight="800">75%</text>
    <text x="1052" y="150" fill="#94a3b8" font-size="12">9 통과 / 2 주의 / 1 미달</text>
  </g>

  <!-- 테이블 -->
  <rect x="32" y="192" width="1216" height="468" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- 헤더 -->
  <rect x="32" y="192" width="1216" height="40" rx="12" fill="#f8fafc"/>
  <rect x="32" y="220" width="1216" height="12" fill="#f8fafc"/>
  <g fill="#475569" font-size="12" font-weight="700">
    <text x="52" y="217">게시물</text>
    <text x="430" y="217" text-anchor="end">오가닉 도달</text>
    <text x="560" y="217" text-anchor="end">광고 도달</text>
    <text x="690" y="217" text-anchor="end">증분(배수)</text>
    <text x="820" y="217" text-anchor="end">오가닉 참여율</text>
    <text x="950" y="217" text-anchor="end">광고 CTR</text>
    <text x="1070" y="217" text-anchor="end">지출</text>
    <text x="1228" y="217" text-anchor="end">검증</text>
  </g>

  <!-- 행 템플릿 -->
  <!-- row 1 (선택됨) -->
  <rect x="32" y="232" width="1216" height="56" fill="#f0fdfa"/>
  <rect x="32" y="232" width="4" height="56" fill="#0d9488"/>
  <rect x="52" y="246" width="28" height="28" rx="5" fill="#cbd5e1"/>
  <text x="92" y="258" fill="#0f172a" font-size="13" font-weight="600">여름 신상 원피스 🌴</text>
  <text x="92" y="276" fill="#94a3b8" font-size="11">06-02 · IG</text>
  <text x="430" y="266" fill="#334155" font-size="13" text-anchor="end">3,120</text>
  <text x="560" y="266" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">22,870</text>
  <text x="690" y="266" fill="#0d9488" font-size="13" font-weight="700" text-anchor="end">×7.3</text>
  <text x="820" y="266" fill="#334155" font-size="13" text-anchor="end">6.3%</text>
  <text x="950" y="266" fill="#334155" font-size="13" text-anchor="end">4.7%</text>
  <text x="1070" y="266" fill="#334155" font-size="13" text-anchor="end">₩84,000</text>
  <rect x="1158" y="250" width="70" height="22" rx="11" fill="#dcfce7"/>
  <text x="1193" y="265" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">통과</text>

  <!-- row 2 -->
  <rect x="52" y="302" width="28" height="28" rx="5" fill="#cbd5e1"/>
  <text x="92" y="314" fill="#0f172a" font-size="13" font-weight="600">브랜드 데일리 룩</text>
  <text x="92" y="332" fill="#94a3b8" font-size="11">06-05 · IG</text>
  <text x="430" y="322" fill="#334155" font-size="13" text-anchor="end">2,450</text>
  <text x="560" y="322" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">15,300</text>
  <text x="690" y="322" fill="#0d9488" font-size="13" font-weight="700" text-anchor="end">×6.2</text>
  <text x="820" y="322" fill="#334155" font-size="13" text-anchor="end">5.1%</text>
  <text x="950" y="322" fill="#334155" font-size="13" text-anchor="end">3.9%</text>
  <text x="1070" y="322" fill="#334155" font-size="13" text-anchor="end">₩60,000</text>
  <rect x="1158" y="306" width="70" height="22" rx="11" fill="#dcfce7"/>
  <text x="1193" y="321" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">통과</text>
  <line x1="52" y1="346" x2="1228" y2="346" stroke="#f1f5f9"/>

  <!-- row 3 (주의) -->
  <rect x="52" y="358" width="28" height="28" rx="5" fill="#cbd5e1"/>
  <text x="92" y="370" fill="#0f172a" font-size="13" font-weight="600">신상 액세서리 모음</text>
  <text x="92" y="388" fill="#94a3b8" font-size="11">06-08 · IG</text>
  <text x="430" y="378" fill="#334155" font-size="13" text-anchor="end">4,010</text>
  <text x="560" y="378" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">9,800</text>
  <text x="690" y="378" fill="#ca8a04" font-size="13" font-weight="700" text-anchor="end">×2.4</text>
  <text x="820" y="378" fill="#334155" font-size="13" text-anchor="end">7.0%</text>
  <text x="950" y="378" fill="#334155" font-size="13" text-anchor="end">2.1%</text>
  <text x="1070" y="378" fill="#334155" font-size="13" text-anchor="end">₩72,000</text>
  <rect x="1158" y="362" width="70" height="22" rx="11" fill="#fef9c3"/>
  <text x="1193" y="377" fill="#a16207" font-size="11" font-weight="700" text-anchor="middle">주의</text>
  <line x1="52" y1="402" x2="1228" y2="402" stroke="#f1f5f9"/>

  <!-- row 4 (미달) -->
  <rect x="52" y="414" width="28" height="28" rx="5" fill="#cbd5e1"/>
  <text x="92" y="426" fill="#0f172a" font-size="13" font-weight="600">쿠폰 안내 공지</text>
  <text x="92" y="444" fill="#94a3b8" font-size="11">06-10 · IG</text>
  <text x="430" y="434" fill="#334155" font-size="13" text-anchor="end">1,980</text>
  <text x="560" y="434" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">3,150</text>
  <text x="690" y="434" fill="#dc2626" font-size="13" font-weight="700" text-anchor="end">×1.6</text>
  <text x="820" y="434" fill="#334155" font-size="13" text-anchor="end">4.4%</text>
  <text x="950" y="434" fill="#334155" font-size="13" text-anchor="end">1.2%</text>
  <text x="1070" y="434" fill="#334155" font-size="13" text-anchor="end">₩55,000</text>
  <rect x="1158" y="418" width="70" height="22" rx="11" fill="#fee2e2"/>
  <text x="1193" y="433" fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle">미달</text>
  <line x1="52" y1="458" x2="1228" y2="458" stroke="#f1f5f9"/>

  <!-- 선택 게시물 상세 비교 차트 -->
  <text x="52" y="492" fill="#0f172a" font-size="14" font-weight="700">선택: 여름 신상 원피스 — 지표 비교</text>
  <!-- 차트 영역 -->
  <line x1="200" y1="512" x2="200" y2="636" stroke="#e2e8f0"/>
  <!-- 도달 -->
  <text x="180" y="534" fill="#64748b" font-size="12" text-anchor="end">도달</text>
  <rect x="210" y="522" width="90" height="14" rx="3" fill="#38bdf8"/>
  <text x="306" y="534" fill="#0369a1" font-size="11">3,120</text>
  <rect x="210" y="540" width="660" height="14" rx="3" fill="#6366f1"/>
  <text x="876" y="552" fill="#4338ca" font-size="11">22,870</text>
  <!-- 노출 -->
  <text x="180" y="586" fill="#64748b" font-size="12" text-anchor="end">노출</text>
  <rect x="210" y="574" width="120" height="14" rx="3" fill="#38bdf8"/>
  <text x="336" y="586" fill="#0369a1" font-size="11">4,540</text>
  <rect x="210" y="592" width="900" height="14" rx="3" fill="#6366f1"/>
  <text x="1116" y="604" fill="#4338ca" font-size="11">41,200</text>
  <!-- 범례 -->
  <rect x="210" y="624" width="12" height="12" rx="2" fill="#38bdf8"/>
  <text x="228" y="634" fill="#64748b" font-size="11">오가닉</text>
  <rect x="300" y="624" width="12" height="12" rx="2" fill="#6366f1"/>
  <text x="318" y="634" fill="#64748b" font-size="11">광고</text>

  <!-- 하단 액션/노트 -->
  <rect x="32" y="676" width="1216" height="60" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="52" y="704" fill="#0e7490" font-size="13" font-weight="700">판정 기준</text>
  <text x="52" y="724" fill="#0891b2" font-size="12">증분 도달 ×3 이상 &amp; 95% CI 하한 &gt; 0 → 통과 · ×1.5~×3 → 주의 · 그 미만 → 미달. 도달 중복 보정 후 추정(분포 기반, exploratory).</text>

  <text x="32" y="772" fill="#94a3b8" font-size="11">시안 B — 리프트 검증 테이블 · 여러 게시물 일괄 점검 + 선택 심층</text>
  <text x="32" y="792" fill="#cbd5e1" font-size="11">docs/management/mockup-organic-vs-paid-B-리프트테이블.svg · 목업(미구현 화면 예시)</text>
</svg>
