# 운영(EC2) 배포용 compose — nginx 단일 진입점 + ECR 이미지 실행
#
# 구조: 인터넷 → nginx(80) → /api는 backend(8000), 그 외는 frontend(3000)
#   - backend/frontend는 호스트에 포트를 publish하지 않음(내부 docker 네트워크로만) → 직접 접근 차단
#   - SG는 80(+22, 추후 443)만 열고 8000/3000은 닫는다
#
# 전제(EC2 ~/clickme/ 에 위치):
#   - REGISTRY 환경변수(cd.yml 배포 스크립트가 주입) = <account>.dkr.ecr.<region>.amazonaws.com
#   - ~/clickme/backend/.env       : 백엔드 운영 환경변수(APP_ENV=production·DATABASE_URL·OPENAI_API_KEY 등)
#   - ~/clickme/deploy/nginx.conf  : nginx 설정(cd.yml deploy 잡이 자동 복사)
#   - frontend의 NEXT_PUBLIC_API_URL은 *이미지 빌드 시점*에 박힘(cd.yml build-arg) → 같은 오리진(http://<host>) 권장
#
# 수동 실행: cd ~/clickme && docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: ${REGISTRY}/clickme-backend:latest
    restart: unless-stopped
    expose:
      - '8000' # 내부 네트워크에만 노출(호스트 publish 안 함)
    env_file:
      - ./backend/.env
    healthcheck:
      # 이미지에 curl이 없어 python으로 체크
      test:
        [
          'CMD',
          'python',
          '-c',
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ${REGISTRY}/clickme-frontend:latest
    restart: unless-stopped
    expose:
      - '3000' # 내부 네트워크에만 노출
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80' # HTTP — ACME 챌린지 + HTTPS 리다이렉트
      - '443:443' # HTTPS 진입점
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # Let's Encrypt 인증서(호스트 영속)
      - ./deploy/certbot-www:/var/www/certbot:ro # ACME webroot 챌린지(갱신 무중단)
    # 6h마다 reload → certbot이 갱신한 새 인증서를 무중단으로 픽업(연결 유지)
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - backend
      - frontend

  # 인증서 자동 갱신 데몬 — 12h마다 certbot renew(만료 30일 이내만 실제 갱신).
  # 최초 발급은 deploy/init-letsencrypt.sh(webroot HTTP-01)가 담당하고,
  # 이 서비스는 그 뒤 갱신만 반복한다. webroot는 nginx가 서빙하는 ./deploy/certbot-www 공유.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt # 인증서 읽기·쓰기(호스트 영속)
      - ./deploy/certbot-www:/var/www/certbot # ACME 챌린지 파일 기록(nginx가 읽음)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
